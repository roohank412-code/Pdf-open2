<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Result 2026 | Secure Result Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header Section -->
  <header class="portal-header">
    <div class="header-content">
      <div class="logo-container">
        <!-- Generic SVG Shield Logo (Works automatically without external image files) -->
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L4 5V11.09C4 16.14 7.41 20.85 12 22C16.59 20.85 20 16.14 20 11.09V5L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 12L11 14L15 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Exam Result 2026</h1>
      <p class="subtitle">Secure Result Viewer</p>
    </div>
  </header>

  <!-- Main Content / Card Section -->
  <main class="main-container">
    <div class="result-card fade-in">
      <div class="card-header">
        <h2>View Result</h2>
        <p class="description">Complete the CAPTCHA below to view your result.</p>
      </div>

      <form id="resultForm" novalidate>
        <!-- CAPTCHA Display & Refresh -->
        <div class="captcha-wrapper">
          <div class="canvas-container">
            <canvas id="captchaCanvas" width="220" height="60" aria-label="CAPTCHA Verification Image"></canvas>
          </div>
          <button type="button" id="refreshCaptchaBtn" class="refresh-btn" aria-label="Refresh CAPTCHA" title="Generate new CAPTCHA">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 4V10H17"></path>
              <path d="M1 20V14H7"></path>
              <path d="M3.51 9A9 9 0 0 1 20.49 4L23 10"></path>
              <path d="M20.49 15A9 9 0 0 1 3.51 20L1 14"></path>
            </svg>
          </button>
        </div>

        <!-- CAPTCHA Input Field -->
        <div class="input-group">
          <label for="captchaInput">Enter 6-Character Code</label>
          <input 
            type="text" 
            id="captchaInput" 
            name="captchaInput" 
            maxlength="6" 
            placeholder="e.g. A8X9K2" 
            autocomplete="off" 
            required>
        </div>

        <!-- Error Alert Message -->
        <div id="errorMessage" class="error-message" role="alert" aria-live="polite"></div>

        <!-- Submit Button with Loading Spinner -->
        <button type="submit" id="submitBtn" class="submit-btn">
          <span class="btn-text">View Result</span>
          <span class="spinner" id="btnSpinner"></span>
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="portal-footer">
    <p>&copy; 2026 Exam Result Portal. All rights reserved.</p>
  </footer>

  <script src="captcha.js"></script>
  <script src="script.js"></script>
</body>
</html>
